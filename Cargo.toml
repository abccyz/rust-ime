[workspace]
resolver = "2"
members = [
    "crates/ime-engine",
    "crates/ime-fcitx5",
    "app",
]

[workspace.lints.rust]
missing_docs = "warn"
unused = "warn"
dead_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
x11-dl = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

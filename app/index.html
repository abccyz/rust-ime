<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>豆包输入法</title>
    <style>
      :root {
        --bg: rgba(20, 22, 28, 0.92);
        --fg: #f5f6f8;
        --muted: #9aa0aa;
        --accent: #4f8cff;
        --border: rgba(255, 255, 255, 0.08);
      }
      html, body {
        margin: 0; padding: 0;
        background: transparent;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        color: var(--fg);
        user-select: none;
      }
      #app {
        display: flex; flex-direction: column; gap: 8px;
        padding: 10px 12px;
      }
      #preedit {
        font-size: 15px;
        color: var(--muted);
        min-height: 20px;
        letter-spacing: 0.5px;
        word-break: break-all;
      }
      #candidates {
        display: flex; gap: 6px; flex-wrap: nowrap;
        overflow-x: auto; overflow-y: hidden;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      #candidates::-webkit-scrollbar { display: none; }
      .cand {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.08s, border-color 0.08s;
      }
      .cand:hover { background: rgba(255, 255, 255, 0.10); }
      .cand.selected {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .cand .py {
        display: block; font-size: 10px; color: var(--muted); margin-top: 2px;
      }
      .cand.selected .py { color: rgba(255, 255, 255, 0.7); }
      #hint {
        font-size: 11px; color: var(--muted);
      }
      #empty {
        font-size: 13px; color: var(--muted); opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="preedit"></div>
      <div id="candidates"><div id="empty">输入拼音以开始（例如 nihao → 你好）</div></div>
      <div id="hint">空格/回车 = 提交首选 · 数字键 = 选择 · Esc = 清除</div>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const preeditEl = document.getElementById('preedit');
      const candEl = document.getElementById('candidates');
      const emptyEl = document.getElementById('empty');

      let selectedIdx = 0;

      function render(view) {
        preeditEl.textContent = view.raw;
        candEl.innerHTML = '';
        if (!view.candidates.length) {
          const d = document.createElement('div');
          d.id = 'empty';
          d.textContent = view.raw ? '（无候选）' : '输入拼音以开始（例如 nihao → 你好）';
          candEl.appendChild(d);
          return;
        }
        selectedIdx = view.candidates.findIndex(c => c.selected);
        if (selectedIdx < 0) selectedIdx = 0;
        view.candidates.forEach((c, i) => {
          const el = document.createElement('div');
          el.className = 'cand' + (i === selectedIdx ? ' selected' : '');
          const main = document.createElement('span');
          main.textContent = c.text;
          const py = document.createElement('span');
          py.className = 'py';
          py.textContent = c.pinyin;
          el.appendChild(main); el.appendChild(py);
          el.addEventListener('click', () => selectCandidate(i));
          candEl.appendChild(el);
        });
      }

      async function selectCandidate(i) {
        try { await invoke('commit_candidate', { idx: i }); } catch (e) { console.error(e); }
      }

      // Keyboard: the window is transparent & key-grabbing. Map keys → engine.
      window.addEventListener('keydown', async (e) => {
        const k = e.key;
        if (k === 'Backspace') { await invoke('feed_key', { key: 'backspace', ch: null }); e.preventDefault(); return; }
        if (k === 'Enter') { await invoke('feed_key', { key: 'enter', ch: null }); e.preventDefault(); return; }
        if (k === ' ') { await invoke('feed_key', { key: 'space', ch: null }); e.preventDefault(); return; }
        if (k === 'Escape') { await invoke('feed_key', { key: 'escape', ch: null }); e.preventDefault(); return; }
        if (k === 'ArrowLeft') { await invoke('feed_key', { key: 'left', ch: null }); e.preventDefault(); return; }
        if (k === 'ArrowRight') { await invoke('feed_key', { key: 'right', ch: null }); e.preventDefault(); return; }
        if (/^[1-9]$/.test(k)) { await invoke('feed_key', { key: 'digit' + k, ch: null }); e.preventDefault(); return; }
        if (/^[a-zA-Z]$/.test(k)) { await invoke('feed_key', { key: k.toLowerCase(), ch: k.toLowerCase() }); e.preventDefault(); return; }
      });

      // Listen for preedit snapshots emitted by the engine.
      window.__TAURI__.event.listen('preedit', (event) => {
        render(event.payload);
      });

      // Focus the body so keydown fires.
      window.addEventListener('load', () => { document.body.focus(); });
    </script>
  </body>
</html>

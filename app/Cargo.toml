[package]
name = "rust-ime-app"
version = "0.1.0"
edition = "2021"
description = "Tauri front end for the rust-ime IME: candidate window + settings"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ime-engine = { path = "../crates/ime-engine" }
ime-fcitx5 = { path = "../crates/ime-fcitx5" }
x11-dl = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
